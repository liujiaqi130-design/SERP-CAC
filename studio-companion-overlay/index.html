<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src http://localhost:3000;" />
  <title>Giotto — Workflow Translator</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17202a;font-synthesis:none;text-rendering:optimizeLegibility;color-scheme:light;--blue:#8db2c1;--ink:#17202a;--muted:#6b7783;--line:#e3e8eb;--soft:#f3f6f8}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}
    .root{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:flex-start;padding:0;background:transparent}
    .launcher{width:186px;height:48px;display:flex;align-items:center;gap:8px;padding:6px 7px 6px 10px;border:1px solid #d7e0e5;border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 8px 26px #0005;-webkit-app-region:drag}
    .launcher-name{font-size:13px;font-weight:700;white-space:nowrap;flex:1}.mark{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg, #90b3ff, #2b66d4);color:white;font-size:15px;box-shadow:0 2px 8px #664aff55}
    .small-btn{width:31px;height:31px;border:0;border-radius:50%;background:transparent;color:#6d7a84;font-size:18px;line-height:1;-webkit-app-region:no-drag}.small-btn:hover{background:#eef3f5;color:#263943}.open-btn{font-size:17px}.quit-btn{font-size:21px}
    .card{display:none;width:100%;height:100%;border:1px solid #e1e5e8;border-radius:17px;background:#fff;box-shadow:0 18px 60px #0006;overflow:hidden}.root.open{display:block;padding:8px}.root.open .card{display:flex;flex-direction:column}.root.open .launcher{display:none}
    .head{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line);-webkit-app-region:drag}.head-label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}.head-label .mark{width:23px;height:23px;font-size:12px}.head-actions{display:flex;gap:2px;-webkit-app-region:no-drag}.head .small-btn{font-size:21px}
    .body{position:relative;overflow:hidden;padding:0;flex:1}.chat-frame{display:block;width:100%;height:100%;border:0;background:#fff}.intro{margin:0 0 12px;color:var(--muted);font-size:11px;line-height:1.45}.label{display:block;margin:0 0 5px;color:#71808b;font-size:9px;font-weight:800;letter-spacing:.075em;text-transform:uppercase}.field{width:100%;border:1px solid #dfe5e8;border-radius:8px;background:#f7f8f9;color:var(--ink);outline:none}.field:focus{border-color:#8fb4c4;box-shadow:0 0 0 3px #8fb4c426}.task{height:68px;padding:9px 10px;resize:vertical;font-size:12px}.select-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0 13px}.select{height:34px;padding:0 8px;font-size:11px}.action{width:100%;height:38px;border:1px solid #88adbd;border-radius:8px;background:#8fb3c2;color:#fff;font-size:12px;font-weight:700}.action:hover{background:#779eae}.micro{text-align:center;color:#929ba2;font-size:9px;margin:8px 0 0}
    .view{display:none}.view.active{display:block}.route{display:flex;align-items:center;gap:7px;background:#f0f3f5;border-radius:7px;padding:7px 9px;margin-bottom:11px;color:#6f7b87;font-size:9px;font-weight:800}.route .arrow{color:#85aabd;font-size:13px}.route .to{color:#5f9ab0}.steps{display:grid;gap:9px}.step{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start}.num{width:19px;height:19px;display:grid;place-items:center;border-radius:50%;background:#eaf2f5;color:#6793a6;font-size:9px;font-weight:800}.step p{font-size:11px;line-height:1.4;margin:1px 0 0}.tip{margin:10px 0 0;padding:9px 10px;border-radius:8px;background:#f5f8f9;color:#697681;font-size:10px;line-height:1.4}.actions{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:12px;padding-top:9px}.feedback{display:flex;gap:6px;align-items:center}.icon-btn,.copy-btn{height:28px;border:1px solid #d9e2e7;border-radius:7px;background:#f9fbfc;color:#668fa0}.icon-btn{width:31px;font-size:14px}.icon-btn:hover,.icon-btn.on{border-color:#87afbf;background:#eaf3f6;color:#47778b}.copy-btn{padding:0 8px;font-size:9px;font-weight:700}.thanks{color:#5d8c6d;font-size:9px}.back{margin-top:10px;border:0;padding:0;background:transparent;color:#688391;font-size:10px}.back:hover{color:#315e71}
    .question-card{border:1px solid #e2e9ed;background:#f6f9fa;border-radius:9px;padding:10px;margin:4px 0 10px}.question-tag{color:#80aabd;text-transform:uppercase;font-size:8px;font-weight:800;letter-spacing:.08em;margin-bottom:4px}.question{font-size:11px;line-height:1.4;margin:0}.choice{width:100%;text-align:left;padding:9px;border:1px solid #dce3e8;border-radius:8px;background:#fff;color:var(--ink);font-size:11px;margin:0 0 6px}.choice:hover,.choice.selected{border-color:#86aebf;background:#f4f8fa}.other{height:33px;padding:0 9px;font-size:11px}.toast{position:absolute;left:50%;bottom:60px;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:#1f2a30;color:#fff;border-radius:99px;padding:7px 11px;font-size:10px;box-shadow:0 5px 20px #0005;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <main class="root" id="root">
    <div class="launcher" id="launcher" aria-label="Giotto. Drag to move; click plus to open."><span class="mark">✦</span><span class="launcher-name">Giotto</span><button class="small-btn open-btn" id="open" aria-label="Open widget">＋</button><button class="small-btn quit-btn" id="quit" aria-label="Quit widget">×</button></div>
    <section class="card" role="dialog" aria-label="Giotto chat assistant">
      <header class="head"><div class="head-label"><span class="mark">✦</span><span> Giotto! <span style="font-size:10px;font-weight:500;color:#89939b">· Giotto v0.1.0</span></span></div><div class="head-actions"><button class="small-btn" id="collapse" aria-label="Minimize widget">−</button><button class="small-btn" id="quit-open" aria-label="Quit widget">×</button></div></header>
      <div class="body">
        <iframe class="chat-frame" id="chat-frame" title="Giotto AI chat" data-src="http://localhost:3000" src="about:blank"></iframe>
      </div>
    </section>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
